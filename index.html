<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MS3 Music Player</title>
<style>
:root{color-scheme:dark;font:17px system-ui;background:#131821;color:#ebedf2}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}main{width:min(720px,100%);border:1px solid #3a4455;border-radius:20px;background:#1c2430;padding:clamp(24px,5vw,48px);box-shadow:0 24px 80px #0005}h1{font-size:clamp(32px,6vw,48px);letter-spacing:-1.5px;margin:8px 0}p{color:#aeb8c8;line-height:1.6}.eyebrow{letter-spacing:3px;color:#89b8ff;font-size:12px;font-weight:700}.row{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}button,select{font:inherit;background:#283447;color:inherit;border:1px solid #50607a;border-radius:9px;padding:12px 18px;cursor:pointer}button:hover{background:#354764}button:disabled{opacity:.4;cursor:default}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #89b8ff;outline-offset:3px}#play{background:#8dbaff;color:#12213b;border-color:#8dbaff;font-weight:700}.tension{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid #3a4455;border-bottom:1px solid #3a4455;padding:24px 0;text-align:center}output{display:block;font-size:32px;font-weight:700}.role{font-size:14px;color:#89b8ff}label{display:grid;gap:10px;flex:1;min-width:150px}input{accent-color:#8dbaff;width:100%}#status{margin-bottom:0;min-height:54px;font-size:14px;overflow-wrap:anywhere}.note{font-size:13px}details{color:#aeb8c8;font-size:12px}pre{white-space:pre-wrap}
</style></head><body><main><div class="eyebrow">MODULAR ADAPTIVE AUDIO</div><h1>MS3 Music Player</h1><p>Choose a bank. Set the tension.<br>Let the composition unfold.</p>
<div class="row"><button id="play" disabled>Play</button><button id="stop" disabled>Stop</button><button id="boss" disabled>Boss</button><button id="fanfare" disabled>Fanfare</button></div>
<div class="tension"><button id="down" aria-label="Decrease tension" disabled>−</button><div><output id="tension" aria-live="polite">Tension 1</output><span class="role" id="role">Chill</span></div><button id="up" aria-label="Increase tension" disabled>+</button></div>
<div class="row"><label>Music bank<select id="bank" disabled></select></label><label>Volume<input id="volume" type="range" min="0" max="1" step=".01" value=".8" aria-label="Volume"></label></div>
<p id="status" role="status">Loading music banks…</p><p class="note">Changes enter on a musical boundary. The current passage stays audible while its successor loads.</p><details><summary>Playback details</summary><pre id="details"></pre></details>
</main><script type="module" src="demo.js"></script></body></html>
